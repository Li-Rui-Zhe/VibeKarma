name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release.mjs
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            message="$(tail -n 80 clippy.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Rust Clippy failed::$message"
            exit 1
          }
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build macOS production application
        if: startsWith(matrix.os, 'macos-')
        run: pnpm tauri build --ci --bundles app -- --locked
      - name: Build Windows production application
        if: matrix.os == 'windows-latest'
        run: pnpm tauri build --ci --no-bundle -- --locked
      - name: Check native startup
        if: matrix.os == 'windows-latest' || startsWith(matrix.os, 'macos-')
        run: node scripts/smoke-native.mjs
      - name: Upload native startup report
        if: always() && (matrix.os == 'windows-latest' || startsWith(matrix.os, 'macos-'))
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-${{ matrix.os }}
          path: |
            .cache/native-smoke/report.json
            .cache/native-smoke/startup.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

