name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            args: --bundles nsis,msi
          - platform: macos-15-intel
            label: macOS Intel
            args: --bundles dmg
          - platform: macos-15
            label: macOS Apple Silicon
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VibeKarma ${{ github.ref_name }}"
          releaseBody: "VibeKarma desktop builds for Windows x64 and macOS (Intel and Apple Silicon). A separately installed Codex CLI is recommended; the desktop app's internal CLI is used only as a compatibility fallback."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

