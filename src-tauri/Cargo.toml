[package]
name = "vibekarma"
version = "0.2.0"
description = "A warm, feedback-driven desktop client for Codex"
authors = ["LiRuiZhe"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vibekarma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "ApplicationModel",
  "Foundation_Collections",
  "Management_Deployment",
  "Storage",
  "Storage_Search",
] }

[target.'cfg(target_os = "macos")'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
